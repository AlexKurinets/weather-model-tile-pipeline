name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wx
          POSTGRES_PASSWORD: wx
          POSTGRES_DB: wx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://wx:wx@localhost:5432/wx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -p no:warnings

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke.sh
      - if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v
