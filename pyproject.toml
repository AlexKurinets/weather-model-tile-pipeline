[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wxtiles"
version = "1.4.0"
description = "Weather model ingest, QC and map tiles: GRIB2, netCDF, radar and satellite to Web Mercator COGs and XYZ tiles"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Kurinets" }]
dependencies = [
    "boto3==1.43.123",
    "eccodes==2.50.0",
    "fastapi==0.162.0",
    "h5netcdf==1.8.2",
    "h5py==3.16.0",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "psycopg[binary,pool]==3.3.6",
    "pyproj==3.8.0",
    "pyyaml==6.0.3",
    "rasterio==1.5.2",
    "rio-tiler==9.4.12",
    "uvicorn==0.54.0",
    "xarray==2026.9.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
wxtiles = "wxtiles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wxtiles = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
