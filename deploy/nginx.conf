# CloudFront stand-in. Tiles are cached for as long as the tiler's Cache-Control allows (a year:
# the run is in the URL, so a tile never changes); manifests for WX_MANIFEST_TTL seconds; the API
# is never cached. X-Cache-Status shows HIT or MISS on every tile and manifest.
proxy_cache_path /var/cache/nginx/wx levels=1:2 keys_zone=wx:50m max_size=2g inactive=7d use_temp_path=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/geo+json text/css application/javascript;

    location /tiles/ {
        proxy_pass http://tiler:8000;
        proxy_cache wx;
        proxy_cache_lock on;
        proxy_cache_valid 404 15s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /manifests/ {
        proxy_pass http://tiler:8000;
        proxy_cache wx;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /api/ {
        proxy_pass http://tiler:8000;
        proxy_buffering off;
    }

    location /geo/ {
        expires 7d;
    }
}
